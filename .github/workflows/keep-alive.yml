name: Streamlit Keep Alive

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      actions: write

    steps:
      - uses: actions/checkout@v5

      # Re-enables the scheduled workflow if GitHub auto-disables it
      - uses: gautamkrishnar/keepalive-workflow@v2

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Visit app
        run: |
          python - <<'EOF'
          from playwright.sync_api import sync_playwright, TimeoutError as PWTimeout

          URL = 'https://fromphysicstoorbits.streamlit.app'

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto(URL, timeout=60000)

              btn = page.locator('button:has-text("Yes, get this app back up!")')
              try:
                  btn.wait_for(state='visible', timeout=10000)
                  print('App was sleeping, waking up...')
                  btn.click()
              except PWTimeout:
                  print('App already awake.')

              # The app itself lives inside an iframe
              app = page.frame_locator('iframe[title="streamlitApp"]') \
                        .locator('[data-testid="stApp"]')
              app.wait_for(state='visible', timeout=90000)

              page.wait_for_timeout(5000)
              browser.close()
              print('Done, app is up.')
          EOF

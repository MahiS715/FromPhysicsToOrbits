name: Streamlit Keep Alive

on:
  schedule:
    - cron: '0 */6 * * *'
  workflow_dispatch:

jobs:
  keep-alive:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      # Only commit if the last commit is older than 45 days
      - name: Keep repo active
        run: |
          last=$(git log -1 --format=%ct)
          now=$(date +%s)
          if [ $((now - last)) -gt $((45 * 86400)) ]; then
            git config user.name "keep-alive-bot"
            git config user.email "keep-alive-bot@users.noreply.github.com"
            git commit --allow-empty -m "chore: keep-alive"
            git push origin main
          else
            echo "Recent activity found, no commit needed."
          fi

      - uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install Playwright
        run: |
          pip install playwright
          playwright install chromium --with-deps

      - name: Visit app
        run: |
          python - <<'EOF'
          from playwright.sync_api import sync_playwright, TimeoutError as PWTimeout

          URL = 'https://fromphysicstoorbits.streamlit.app'

          with sync_playwright() as p:
              browser = p.chromium.launch(headless=True)
              page = browser.new_page()
              page.goto(URL, timeout=60000)

              btn = page.locator('button:has-text("Yes, get this app back up!")')
              try:
                  btn.wait_for(state='visible', timeout=10000)
                  print('App was sleeping, waking up...')
                  btn.click()
              except PWTimeout:
                  print('App already awake.')

              app = page.frame_locator('iframe[title="streamlitApp"]') \
                        .locator('[data-testid="stApp"]')
              app.wait_for(state='visible', timeout=90000)

              page.wait_for_timeout(5000)
              browser.close()
              print('Done, app is up.')
          EOF
